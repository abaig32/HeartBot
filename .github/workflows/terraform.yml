name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Connects to the S3 remote backend and downloads provider plugins
      - name: Terraform Init
        run: terraform init

      # Fails the pipeline if any .tf file is not formatted — enforces consistency
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Catches syntax errors and invalid resource references before any AWS calls are made
      - name: Terraform Validate
        run: terraform validate

      # On pull requests — run plan and post the output as a PR comment
      # This lets you review exactly what will change before merging
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        env:
          TF_VAR_alarm_email: ${{ secrets.TF_VAR_ALARM_EMAIL }}
        run: terraform plan -no-color
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: exit 1

      # On merge to main — apply the changes automatically
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TF_VAR_alarm_email: ${{ secrets.TF_VAR_ALARM_EMAIL }}
        run: terraform apply -auto-approve
